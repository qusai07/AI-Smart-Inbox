name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore
      - run: dotnet build --no-restore -c Release
      - run: dotnet test tests/SmartInbox.UnitTests --no-build -c Release
      # SDK against the real API in-process (in-memory DB, rule-based AI), incl. a real webhook delivery
      - run: dotnet test tests/SmartInbox.Client.Tests --no-build -c Release
      # MCP server tools, permissions, prompt-injection handling and both transports, against the same in-process API
      - run: dotnet test tests/SmartInbox.Mcp.Tests --no-build -c Release

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/smart-inbox-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/smart-inbox-web/package-lock.json
      - run: npm ci
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t smart-inbox .
